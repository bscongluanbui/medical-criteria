name: Docker tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral local configuration
        run: python3 scripts/init_env.py
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and test SQLite + PostgreSQL
        run: docker compose --profile test run --build --rm test
      - name: Start runtime
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build --wait --wait-timeout 120
      - name: Check liveness
        run: |
          curl --fail http://127.0.0.1:8001/health/live
          curl --fail http://127.0.0.1:3500/health/live
          curl --fail http://127.0.0.1:3500/public/cards
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3500/dashboard)" = "303"
      - name: Cleanup ephemeral CI resources
        if: always()
        run: docker compose --profile test down --volumes
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/bscongluanbui/medical-criteria:latest
            ghcr.io/bscongluanbui/medical-criteria:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/bscongluanbui/medical-criteria
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
